<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Validador de Boletos — TeensClub®</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="shortcut icon" href="/favicon.ico"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0a1330;--cream:#e6e1cf;--green:#4caf7d;--red:#d64545;--accent:#ffb84d}
body{background:var(--navy);color:var(--cream);font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;padding:0}

.top-bar{background:rgba(10,19,48,.95);border-bottom:1px solid rgba(230,225,207,.1);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top-logo{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:-.01em}
.top-logo sup{font-size:8px;opacity:.5}
.top-badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;background:rgba(230,225,207,.08);border:1px solid rgba(230,225,207,.15);padding:5px 10px;border-radius:100px;opacity:.7}

.container{padding:24px 20px;max-width:480px;margin:0 auto}

.event-info{background:rgba(230,225,207,.05);border:1px solid rgba(230,225,207,.12);border-radius:16px;padding:16px 18px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
.event-name{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:-.01em}
.event-meta{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.45;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.event-vol{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.1em}

.scanner-section{margin-bottom:24px}
.section-title{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.4;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:16px;height:1px;background:var(--cream);opacity:.4}

#scanner-container{border-radius:16px;overflow:hidden;background:rgba(0,0,0,.4);position:relative;aspect-ratio:1}
#reader{width:100% !important}
#reader video{border-radius:16px}

.scanner-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.scan-frame{width:60%;aspect-ratio:1;border:2px solid rgba(230,225,207,.5);border-radius:12px;position:relative}
.scan-frame::before,.scan-frame::after{content:"";position:absolute;width:20px;height:20px;border-color:var(--cream);border-style:solid}
.scan-frame::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.scan-frame::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:0}50%{top:calc(100% - 2px)}}

.btn-start{width:100%;padding:16px;border-radius:100px;background:var(--cream);color:var(--navy);font-family:'Archivo Black',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.04em;border:none;cursor:pointer;margin-top:12px}
.btn-stop{width:100%;padding:14px;border-radius:100px;background:transparent;border:1px solid rgba(230,225,207,.2);color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;margin-top:10px;opacity:.6}

/* Manual input */
.manual-section{margin-bottom:24px}
.input-row{display:flex;gap:10px}
.ticket-input{flex:1;background:rgba(230,225,207,.06);border:1px solid rgba(230,225,207,.15);border-radius:12px;padding:14px 16px;color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;outline:none}
.ticket-input::placeholder{opacity:.3;text-transform:none;letter-spacing:0}
.ticket-input:focus{border-color:rgba(230,225,207,.4)}
.btn-validate{padding:14px 20px;border-radius:12px;background:var(--cream);color:var(--navy);font-family:'Archivo Black',sans-serif;font-size:12px;text-transform:uppercase;border:none;cursor:pointer;white-space:nowrap}

/* Result */
.result{border-radius:16px;padding:24px;margin-bottom:20px;display:none}
.result.valid{background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.3)}
.result.invalid{background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.3)}
.result.used{background:rgba(255,184,77,.08);border:1px solid rgba(255,184,77,.3)}
.result-icon{font-size:36px;margin-bottom:12px}
.result-status{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.result.valid .result-status{color:var(--green)}
.result.invalid .result-status{color:var(--red)}
.result.used .result-status{color:var(--accent)}
.result-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:16px}
.result-details{display:flex;flex-direction:column;gap:8px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(230,225,207,.08)}
.result-row:last-child{border-bottom:none}
.result-key{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;opacity:.4}
.result-val{font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:-.01em}
.btn-next{width:100%;padding:13px;border-radius:100px;background:rgba(230,225,207,.1);border:1px solid rgba(230,225,207,.15);color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;margin-top:16px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat-box{background:rgba(230,225,207,.04);border:1px solid rgba(230,225,207,.1);border-radius:14px;padding:16px 12px;text-align:center}
.stat-n{font-family:'Archivo Black',sans-serif;font-size:28px;letter-spacing:-.03em}
.stat-n.green{color:var(--green)}
.stat-n.red{color:var(--red)}
.stat-n.yellow{color:var(--accent)}
.stat-l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;opacity:.4;margin-top:4px}

/* History */
.history{background:rgba(230,225,207,.03);border:1px solid rgba(230,225,207,.08);border-radius:16px;overflow:hidden}
.history-header{padding:14px 16px;border-bottom:1px solid rgba(230,225,207,.08);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;opacity:.4}
.history-item{padding:12px 16px;border-bottom:1px solid rgba(230,225,207,.06);display:flex;justify-content:space-between;align-items:center}
.history-item:last-child{border-bottom:none}
.history-ticket{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em}
.history-name{font-size:13px;font-weight:600;margin-top:2px}
.history-badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:100px}
.history-badge.valid{background:rgba(76,175,125,.15);color:var(--green)}
.history-badge.invalid{background:rgba(214,69,69,.15);color:var(--red)}
.history-badge.used{background:rgba(255,184,77,.15);color:var(--accent)}
.history-empty{padding:24px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.3;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-logo">TeensClub<sup>®</sup></div>
  <div class="top-badge">Staff · Validador</div>
</div>

<div class="container">

  <!-- Evento info -->
  <div class="event-info">
    <div>
      <div class="event-name">Tardeada Junio</div>
      <div class="event-meta">Dom 14 Jun 2026 · 2:00 PM · Green Plaza</div>
    </div>
    <div class="event-vol">VOL.01</div>
  </div>

  <!-- Stats -->
  <div class="section-title">Resumen del día</div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-n green" id="stat-valid">0</div><div class="stat-l">Válidos</div></div>
    <div class="stat-box"><div class="stat-n yellow" id="stat-used">0</div><div class="stat-l">Ya usados</div></div>
    <div class="stat-box"><div class="stat-n red" id="stat-invalid">0</div><div class="stat-l">Inválidos</div></div>
  </div>

  <!-- Resultado -->
  <div class="result" id="result">
    <div class="result-icon" id="result-icon">✓</div>
    <div class="result-status" id="result-status">Válido</div>
    <div class="result-sub" id="result-sub">Boleto verificado</div>
    <div class="result-details" id="result-details"></div>
    <button class="btn-next" onclick="resetResult()">Escanear siguiente →</button>
  </div>

  <!-- Scanner -->
  <div class="scanner-section">
    <div class="section-title">Escáner QR</div>
    <div id="scanner-container" style="display:none">
      <div id="reader"></div>
      <div class="scanner-overlay">
        <div class="scan-frame"><div class="scan-line"></div></div>
      </div>
    </div>
    <button class="btn-start" id="btn-start" onclick="startScanner()">📷 Activar cámara</button>
    <button class="btn-stop" id="btn-stop" style="display:none" onclick="stopScanner()">Detener cámara</button>
  </div>

  <!-- Manual -->
  <div class="manual-section">
    <div class="section-title">Ingresar número manualmente</div>
    <div class="input-row">
      <input class="ticket-input" id="manual-input" type="text" placeholder="TC-001-00000" maxlength="12" oninput="formatTicket(this)"/>
      <button class="btn-validate" onclick="validateManual()">Validar</button>
    </div>
  </div>

  <!-- Historial -->
  <div class="section-title">Últimos escaneos</div>
  <div class="history">
    <div class="history-header">Historial de esta sesión</div>
    <div id="history-list"><div class="history-empty">Sin escaneos aún</div></div>
  </div>

</div>

<script>
// Base de datos local de boletos validados en esta sesión
const usedTickets = new Set();
const scanHistory = [];
let stats = { valid: 0, used: 0, invalid: 0 };
let qrScanner = null;

function formatTicket(input) {
  let val = input.value.toUpperCase().replace(/[^TC0-9\-]/g, '');
  input.value = val;
}

function validateTicket(rawData) {
  try {
    // Intentar parsear como JSON (QR del boleto)
    let ticketData;
    try {
      ticketData = JSON.parse(rawData);
    } catch {
      // Si no es JSON, tratar como número de boleto directo
      ticketData = { id: rawData, event: 'TC-VOL01', valid: true };
    }

    const ticketId = ticketData.id || rawData;

    // Validar formato TC-001-XXXXX
    const validFormat = /^TC-0\d{2}-\d{5}$/.test(ticketId);
    const correctEvent = ticketData.event === 'TC-VOL01';

    if (!validFormat || !correctEvent) {
      return {
        status: 'invalid',
        icon: '✕',
        title: 'Boleto inválido',
        sub: 'No corresponde a este evento',
        details: [
          { key: 'Código', val: ticketId },
          { key: 'Motivo', val: 'Formato no reconocido' }
        ]
      };
    }

    if (usedTickets.has(ticketId)) {
      return {
        status: 'used',
        icon: '⚠',
        title: 'Ya fue usado',
        sub: 'Este boleto ya entró al evento',
        details: [
          { key: 'N° Boleto', val: ticketId },
          { key: 'Cover', val: ticketData.cover || '—' },
          { key: 'Nombre', val: ticketData.buyer || '—' },
          { key: 'Estado', val: 'ACCESO YA REGISTRADO' }
        ]
      };
    }

    // Boleto válido — marcarlo como usado
    usedTickets.add(ticketId);
    return {
      status: 'valid',
      icon: '✓',
      title: '¡Acceso permitido!',
      sub: 'Boleto verificado correctamente',
      details: [
        { key: 'N° Boleto', val: ticketId },
        { key: 'Cover', val: ticketData.cover || 'General' },
        { key: 'Nombre', val: ticketData.buyer || '—' },
        { key: 'Estado', val: 'PRIMER ACCESO ✓' }
      ]
    };

  } catch (e) {
    return {
      status: 'invalid',
      icon: '✕',
      title: 'Error de lectura',
      sub: 'No se pudo leer el boleto',
      details: [{ key: 'Error', val: 'QR no reconocido' }]
    };
  }
}

function showResult(result) {
  const el = document.getElementById('result');
  el.className = `result ${result.status}`;
  el.style.display = 'block';
  document.getElementById('result-icon').textContent = result.icon;
  document.getElementById('result-status').textContent = result.title;
  document.getElementById('result-sub').textContent = result.sub;

  const details = document.getElementById('result-details');
  details.innerHTML = result.details.map(d =>
    `<div class="result-row"><div class="result-key">${d.key}</div><div class="result-val">${d.val}</div></div>`
  ).join('');

  // Actualizar stats
  stats[result.status]++;
  document.getElementById('stat-valid').textContent = stats.valid;
  document.getElementById('stat-used').textContent = stats.used;
  document.getElementById('stat-invalid').textContent = stats.invalid;

  // Agregar al historial
  const ticket = result.details[0]?.val || '—';
  const name = result.details.find(d => d.key === 'Nombre')?.val || '—';
  scanHistory.unshift({ ticket, name, status: result.status });
  updateHistory();

  // Vibración en móvil
  if(navigator.vibrate) {
    if(result.status === 'valid') navigator.vibrate([100]);
    else if(result.status === 'used') navigator.vibrate([200, 100, 200]);
    else navigator.vibrate([500]);
  }
}

function updateHistory() {
  const list = document.getElementById('history-list');
  if (scanHistory.length === 0) {
    list.innerHTML = '<div class="history-empty">Sin escaneos aún</div>';
    return;
  }
  list.innerHTML = scanHistory.slice(0, 10).map(item => `
    <div class="history-item">
      <div>
        <div class="history-ticket">${item.ticket}</div>
        <div class="history-name">${item.name}</div>
      </div>
      <div class="history-badge ${item.status}">
        ${item.status === 'valid' ? 'Válido' : item.status === 'used' ? 'Ya usado' : 'Inválido'}
      </div>
    </div>
  `).join('');
}

function resetResult() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('manual-input').value = '';
}

function validateManual() {
  const input = document.getElementById('manual-input').value.trim();
  if (!input) return;
  // Construir JSON simulado para validar
  const fakeQR = JSON.stringify({ id: input, event: 'TC-VOL01', cover: 'General', buyer: 'Validación manual', valid: true });
  const result = validateTicket(fakeQR);
  showResult(result);
}

async function startScanner() {
  document.getElementById('scanner-container').style.display = 'block';
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'block';

  qrScanner = new Html5Qrcode('reader');
  try {
    await qrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        const result = validateTicket(decodedText);
        showResult(result);
        // Pausa breve antes de seguir escaneando
        qrScanner.pause();
        setTimeout(() => { try { qrScanner.resume(); } catch(e){} }, 3000);
      },
      () => {}
    );
  } catch (err) {
    alert('No se pudo acceder a la cámara. Asegúrate de dar permiso.');
    stopScanner();
  }
}

function stopScanner() {
  if (qrScanner) {
    qrScanner.stop().catch(() => {});
    qrScanner = null;
  }
  document.getElementById('scanner-container').style.display = 'none';
  document.getElementById('btn-start').style.display = 'block';
  document.getElementById('btn-stop').style.display = 'none';
}
</script>
</body>
</html>
