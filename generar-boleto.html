<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TeensClub® — Generador de boletos</title>
<meta name="theme-color" content="#000000"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--tc-black);color:var(--tc-fg);font-family:var(--tc-font-sans);-webkit-font-smoothing:antialiased;min-height:100vh;padding:24px 20px 48px;}
.wrap{max-width:480px;margin:0 auto;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;}
.wm{font-weight:900;font-size:18px;letter-spacing:-.03em;}
.wm sup{font-size:.38em;font-weight:700;}
.badge{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tc-fg-muted);}
h1{font-size:28px;font-weight:900;letter-spacing:-.03em;margin-bottom:6px;}
.sub{font-size:14px;color:var(--tc-fg-muted);margin-bottom:28px;}

.form-group{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tc-fg-muted);margin-bottom:8px;}
input,select{width:100%;background:var(--tc-surface);border:1px solid var(--tc-border-strong);border-radius:var(--tc-radius-sm);padding:13px 14px;font-family:inherit;font-weight:600;font-size:15px;color:var(--tc-fg);outline:none;}
input:focus,select:focus{border-color:var(--tc-blue);box-shadow:var(--tc-glow-blue-sm);}
select option{background:var(--tc-surface);}

.btn{width:100%;padding:15px;border-radius:var(--tc-radius-sm);background:var(--tc-blue);color:#fff;font-family:inherit;font-weight:700;font-size:15px;border:none;cursor:pointer;margin-top:8px;box-shadow:var(--tc-glow-blue-sm);transition:background .15s;}
.btn:hover{background:var(--tc-blue-600);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* RESULTADO */
.result{display:none;margin-top:32px;background:var(--tc-surface);border:1px solid var(--tc-border-strong);border-radius:12px;overflow:hidden;}
.result-head{background:var(--tc-blue);padding:14px 20px;display:flex;align-items:center;gap:10px;}
.result-head .check{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;}
.result-head .txt{font-size:13px;font-weight:700;color:#fff;}
.result-body{padding:20px;}
.qr-wrap{display:flex;justify-content:center;margin-bottom:20px;}
#qrCanvas{border-radius:8px;}
.rows{margin-bottom:20px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--tc-border);}
.row:last-child{border-bottom:none;}
.row .k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tc-fg-muted);}
.row .v{font-size:14px;font-weight:700;color:var(--tc-fg);}
.folio-big{text-align:center;font-size:24px;font-weight:900;letter-spacing:.06em;color:var(--tc-blue);margin-bottom:20px;}

.actions{display:flex;flex-direction:column;gap:10px;}
.btn-dl{width:100%;padding:13px;border-radius:var(--tc-radius-sm);background:var(--tc-fg);color:var(--tc-black);font-family:inherit;font-weight:700;font-size:14px;border:none;cursor:pointer;}
.btn-new{width:100%;padding:13px;border-radius:var(--tc-radius-sm);background:transparent;border:1px solid var(--tc-border-strong);color:var(--tc-fg);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;}

.back{display:inline-flex;align-items:center;gap:6px;margin-top:28px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tc-fg-faint);text-decoration:none;}
.back:hover{color:var(--tc-blue);}

/* LOGIN */
.lock{position:fixed;inset:0;background:var(--tc-black);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;}
.lock-box{background:var(--tc-surface);border:1px solid var(--tc-border-strong);border-radius:12px;padding:36px 28px;max-width:340px;width:100%;text-align:center;}
.lock-logo{font-size:20px;font-weight:900;letter-spacing:-.03em;margin-bottom:4px;}
.lock-sub{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tc-fg-muted);margin-bottom:24px;}
.lock-inp{width:100%;background:var(--tc-black);border:1px solid var(--tc-border-strong);border-radius:var(--tc-radius-sm);padding:13px;font-family:inherit;font-weight:600;font-size:15px;color:var(--tc-fg);text-align:center;letter-spacing:.1em;outline:none;margin-bottom:12px;}
.lock-inp:focus{border-color:var(--tc-blue);}
.lock-btn{width:100%;padding:13px;border-radius:var(--tc-radius-sm);background:var(--tc-blue);color:#fff;font-family:inherit;font-weight:700;font-size:14px;border:none;cursor:pointer;}
.lock-err{font-size:11px;color:#E5484D;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;display:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="lock" id="lock">
  <div class="lock-box">
    <div class="lock-logo">TeensClub<sup>®</sup></div>
    <div class="lock-sub">Generador de boletos · Staff</div>
    <input class="lock-inp" type="password" id="lockPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')tryUnlock()"/>
    <button class="lock-btn" onclick="tryUnlock()">Entrar →</button>
    <div class="lock-err" id="lockErr">Contraseña incorrecta</div>
  </div>
</div>

<div class="wrap">
  <div class="header">
    <div class="wm">TeensClub<sup>®</sup></div>
    <div class="badge">Generador · Staff</div>
  </div>

  <h1>Generar boleto</h1>
  <p class="sub">Para pagos en efectivo. El folio se genera automáticamente.</p>

  <div class="form-group">
    <label>Nombre completo</label>
    <input type="text" id="nombre" placeholder="Nombre Apellido" autocomplete="off"/>
  </div>

  <div class="form-group">
    <label>Cover</label>
    <select id="cover">
      <option value="Barra libre">Barra libre — $250</option>
    </select>
  </div>

  <div class="form-group">
    <label>RP (opcional)</label>
    <input type="text" id="rp" placeholder="Nombre del RP o cuenta propia"/>
  </div>

  <button class="btn" id="genBtn" onclick="generar()">Generar boleto</button>

  <!-- RESULTADO -->
  <div class="result" id="result">
    <div class="result-head">
      <div class="check">✓</div>
      <div class="txt">Boleto generado · Efectivo</div>
    </div>
    <div class="result-body">
      <div class="folio-big" id="folioDisplay"></div>
      <div class="qr-wrap"><canvas id="qrCanvas"></canvas></div>
      <div class="rows" id="rows"></div>
      <div class="actions">
        <button class="btn-dl" onclick="descargar()">↓ Descargar boleto</button>
        <button class="btn-new" onclick="nuevo()">Generar otro boleto</button>
      </div>
    </div>
  </div>

  <a class="back" href="index.html">← Volver al sitio</a>
</div>

<script>
const PASS = 'teensclub26';
const LOG_URL = 'https://script.google.com/macros/s/AKfycbzuGhixYZMHrKU2y7rKVDQ_CfcqpNYEWWs1MaFebWszCRrCMZUnTN9NfTto4vFvLlys/exec';

function tryUnlock() {
  if (document.getElementById('lockPass').value === PASS) {
    document.getElementById('lock').style.display = 'none';
  } else {
    document.getElementById('lockErr').style.display = 'block';
    document.getElementById('lockPass').value = '';
  }
}

function genFolio() {
  const a = Date.now().toString(36).toUpperCase().slice(-4);
  const b = Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  return 'TC1-' + a + '-' + b;
}

let currentOrder = null;

function generar() {
  const nombre = document.getElementById('nombre').value.trim();
  if (nombre.length < 3) { alert('Escribe el nombre completo.'); return; }

  const cover = document.getElementById('cover').value;
  const rp = document.getElementById('rp').value.trim() || 'Cuenta propia';
  const folio = genFolio();
  const fecha = new Date().toLocaleString('es-MX');

  currentOrder = { folio, nombre, cover, rp, fecha, precio: 250, evento: 'TeensClub Vol.01', metodo: 'Efectivo' };

  // QR content
  const qrText = `TEENSCLUB VOL.01\nFolio: ${folio}\nNombre: ${nombre}\nCover: ${cover}\nRP: ${rp}`;

  QRCode.toCanvas(document.getElementById('qrCanvas'), qrText, {
    width: 200,
    margin: 2,
    color: { dark: '#000000', light: '#FFFFFF' }
  });

  document.getElementById('folioDisplay').textContent = folio;
  document.getElementById('rows').innerHTML = `
    <div class="row"><span class="k">Nombre</span><span class="v">${nombre}</span></div>
    <div class="row"><span class="k">Cover</span><span class="v">${cover}</span></div>
    <div class="row"><span class="k">Total</span><span class="v">$250 MXN · Efectivo</span></div>
    <div class="row"><span class="k">RP</span><span class="v">${rp}</span></div>
    <div class="row"><span class="k">Fecha</span><span class="v">${fecha}</span></div>
  `;

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });

  // Registrar en Google Sheets
  fetch(LOG_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(currentOrder)
  }).catch(() => {});
}

function descargar() {
  const canvas = document.getElementById('qrCanvas');
  const link = document.createElement('a');
  link.download = `TeensClub-${currentOrder.folio}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function nuevo() {
  document.getElementById('nombre').value = '';
  document.getElementById('rp').value = '';
  document.getElementById('result').style.display = 'none';
  document.getElementById('nombre').focus();
  currentOrder = null;
}
</script>
</body>
</html>
