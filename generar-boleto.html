<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TeensClub® — Generar boleto</title>
<meta name="theme-color" content="#000000"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;color:#fafafa;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:24px 20px 48px;}
.wrap{max-width:480px;margin:0 auto;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-top:8px;}
.wm{font-weight:900;font-size:18px;letter-spacing:-.03em;}
.badge{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8a8a92;}
h1{font-size:28px;font-weight:900;letter-spacing:-.03em;margin-bottom:6px;}
.sub{font-size:14px;color:#8a8a92;margin-bottom:28px;line-height:1.5;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a8a92;margin-bottom:8px;}
input,select{width:100%;background:#111114;border:1px solid #2a2a31;border-radius:4px;padding:13px 14px;font-family:inherit;font-weight:600;font-size:15px;color:#fafafa;outline:none;}
input:focus,select:focus{border-color:#1f1fff;}
select option{background:#111114;}
.btn{width:100%;padding:15px;border-radius:4px;background:#1f1fff;color:#fff;font-family:inherit;font-weight:700;font-size:15px;border:none;cursor:pointer;margin-top:8px;}
.result{display:none;margin-top:32px;background:#111114;border:1px solid #2a2a31;border-radius:12px;overflow:hidden;}
.result-head{background:#1f1fff;padding:14px 20px;display:flex;align-items:center;gap:10px;}
.check{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;}
.result-head .txt{font-size:13px;font-weight:700;color:#fff;}
.result-body{padding:20px;}
.qr-wrap{display:flex;justify-content:center;margin-bottom:20px;background:#fff;padding:12px;border-radius:8px;}
.folio-big{text-align:center;font-size:22px;font-weight:900;letter-spacing:.06em;color:#1f1fff;margin-bottom:20px;}
.rows{margin-bottom:20px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #1a1a1f;}
.row:last-child{border-bottom:none;}
.row .k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a8a92;}
.row .v{font-size:14px;font-weight:700;color:#fafafa;text-align:right;}
.actions{display:flex;flex-direction:column;gap:10px;}
.btn-dl{width:100%;padding:13px;border-radius:4px;background:#fafafa;color:#000;font-family:inherit;font-weight:700;font-size:14px;border:none;cursor:pointer;}
.btn-new{width:100%;padding:13px;border-radius:4px;background:transparent;border:1px solid #2a2a31;color:#fafafa;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:28px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#54545c;text-decoration:none;}
.lock{position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;}
.lock-box{background:#111114;border:1px solid #2a2a31;border-radius:12px;padding:36px 28px;max-width:340px;width:100%;text-align:center;}
.lock-logo{font-size:20px;font-weight:900;margin-bottom:4px;}
.lock-sub{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8a8a92;margin-bottom:24px;}
.lock-inp{width:100%;background:#000;border:1px solid #2a2a31;border-radius:4px;padding:13px;font-family:inherit;font-weight:600;font-size:15px;color:#fafafa;text-align:center;letter-spacing:.1em;outline:none;margin-bottom:12px;}
.lock-btn{width:100%;padding:13px;border-radius:4px;background:#1f1fff;color:#fff;font-family:inherit;font-weight:700;font-size:14px;border:none;cursor:pointer;}
.lock-err{font-size:11px;color:#e5484d;font-weight:700;margin-top:10px;display:none;}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-box">
    <div class="lock-logo">TeensClub®</div>
    <div class="lock-sub">Generador de boletos · Staff</div>
    <input class="lock-inp" type="password" id="lockPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')tryUnlock()"/>
    <button class="lock-btn" id="lockBtn">Entrar →</button>
    <div class="lock-err" id="lockErr">Contraseña incorrecta</div>
  </div>
</div>

<div class="wrap">
  <div class="header">
    <div class="wm">TeensClub®</div>
    <div class="badge">Generador · Staff</div>
  </div>
  <h1>Generar boleto</h1>
  <p class="sub">Para pagos en efectivo. El folio y QR se generan automáticamente.</p>

  <div class="form-group">
    <label>Nombre completo</label>
    <input type="text" id="nombre" placeholder="Nombre Apellido" autocomplete="off"/>
  </div>
  <div class="form-group">
    <label>Cover</label>
    <select id="cover">
      <option value="Barra libre">Barra libre — $250 MXN</option>
    </select>
  </div>
  <div class="form-group">
    <label>RP (opcional)</label>
    <input type="text" id="rp" placeholder="Nombre del RP o cuenta propia"/>
  </div>
  <button class="btn" onclick="generar()">Generar boleto →</button>

  <div class="result" id="result">
    <div class="result-head">
      <div class="check">✓</div>
      <div class="txt">Boleto generado · Efectivo</div>
    </div>
    <div class="result-body">
      <div class="folio-big" id="folioDisplay"></div>
      <div class="qr-wrap"><canvas id="qrCanvas" width="200" height="200"></canvas></div>
      <div class="rows" id="rows"></div>
      <div class="actions">
        <button class="btn-dl" onclick="descargar()">↓ Descargar QR</button>
        <button class="btn-new" onclick="nuevo()">Generar otro boleto</button>
      </div>
    </div>
  </div>
  <a class="back" href="index.html">← Volver al sitio</a>
</div>

// ── App ────────────────────────────────────────────────────────────────────
const PASS='teensclub26';
const LOG_URL='https://script.google.com/macros/s/AKfycbzuGhixYZMHrKU2y7rKVDQ_CfcqpNYEWWs1MaFebWszCRrCMZUnTN9NfTto4vFvLlys/exec';
let currentOrder=null;

function tryUnlock(){
  if(document.getElementById('lockPass').value===PASS){
    document.getElementById('lock').style.display='none';
  }else{
    document.getElementById('lockErr').style.display='block';
    document.getElementById('lockPass').value='';
  }
}

function genFolio(){
  const a=Date.now().toString(36).toUpperCase().slice(-4);
  const b=Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);
  return 'TC1-'+a+'-'+b;
}

function generar(){
  const nombre=document.getElementById('nombre').value.trim();
  if(nombre.length<3){alert('Escribe el nombre completo.');return;}
  const cover=document.getElementById('cover').value;
  const rp=document.getElementById('rp').value.trim()||'Cuenta propia';
  const folio=genFolio();
  const fecha=new Date().toLocaleString('es-MX');
  currentOrder={folio,nombre,cover,rp,fecha,precio:250,evento:'TeensClub Vol.01',metodo:'Efectivo'};

  const canvas=document.getElementById('qrCanvas');
  const ctx=canvas.getContext('2d');
  const qrText='TEENSCLUB VOL.01\nFolio: '+folio+'\nNombre: '+nombre+'\nCover: '+cover+'\nRP: '+rp;

  try{
    const qr=QRCode.create(qrText,{correctLevel:QRCode.CorrectLevel.M,typeNumber:0});
    const count=qr.getModuleCount();
    const size=200;
    const cell=size/count;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000000';
    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect(Math.floor(c*cell),Math.floor(r*cell),Math.ceil(cell),Math.ceil(cell));
        }
      }
    }
  }catch(e){
    // fallback simple folio display
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,200,200);
    ctx.fillStyle='#000';
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    ctx.fillText(folio,100,100);
  }

  document.getElementById('folioDisplay').textContent=folio;
  document.getElementById('rows').innerHTML=
    '<div class="row"><span class="k">Nombre</span><span class="v">'+nombre+'</span></div>'+
    '<div class="row"><span class="k">Cover</span><span class="v">'+cover+'</span></div>'+
    '<div class="row"><span class="k">Total</span><span class="v">$250 MXN · Efectivo</span></div>'+
    '<div class="row"><span class="k">RP</span><span class="v">'+rp+'</span></div>'+
    '<div class="row"><span class="k">Fecha</span><span class="v">'+fecha+'</span></div>';

  document.getElementById('result').style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});

  fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentOrder)}).catch(function(){});
}

function descargar(){
  if(!currentOrder)return;
  const canvas=document.getElementById('qrCanvas');
  const link=document.createElement('a');
  link.download='TeensClub-'+currentOrder.folio+'.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}

document.getElementById("lockBtn").addEventListener("click", tryUnlock);
document.getElementById("lockPass").addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });

function nuevo(){
  document.getElementById('nombre').value='';
  document.getElementById('rp').value='';
  document.getElementById('result').style.display='none';
  document.getElementById('nombre').focus();
  currentOrder=null;
}
</script>
</body>
</html>
